name: Build Yug Policy Reminder APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract FIXED project ZIP
        run: |
          unzip -o Yug_Policy_Reminder_Firebase_SYNC_FIXED_V3.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check project files
        run: |
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f settings.gradle.kts

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yug-Policy-Reminder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
