name: Build Yug Policy Reminder APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract Firebase project ZIP
        run: |
          unzip -o Yug_Policy_Reminder_Firebase_SYNC_READY.zip -d .
          find Yug_Policy_Reminder_Firebase -maxdepth 3 -type f | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Check Firebase config
        working-directory: Yug_Policy_Reminder_Firebase
        run: test -f app/google-services.json

      - name: Build APK
        working-directory: Yug_Policy_Reminder_Firebase
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yug-Policy-Reminder-APK
          path: Yug_Policy_Reminder_Firebase/app/build/outputs/apk/debug/app-debug.apk
