name: Build Yug Policy Reminder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o Yug_Policy_Reminder_Tablet_Build.zip -d app-project
          cd app-project
          find . -maxdepth 3 -type f | head -50

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: app-project
        run: gradle :app:assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=warning
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Yug-Policy-Reminder-APK
          path: app-project/app/build/outputs/apk/debug/app-debug.apk
